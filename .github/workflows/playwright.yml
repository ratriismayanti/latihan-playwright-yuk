name: Playwright TypeScript

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Install browser + dependency OS
        run: npx playwright install --with-deps

      - name: Jalankan test
        run: npx playwright test
        env:
          TOKOQA_USERNAME: ${{ secrets.TOKOQA_USERNAME }}
          TOKOQA_PASSWORD: ${{ secrets.TOKOQA_PASSWORD }}

      - name: Simpan HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14